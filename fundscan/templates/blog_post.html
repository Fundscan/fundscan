<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{ post.title }} | FundScan</title>
<meta name="description" content="{{ post.description }}">
<link rel="canonical" href="{{ site_url }}/blog/{{ post.slug }}">

<meta property="og:type" content="article">
<meta property="og:site_name" content="FundScan">
<meta property="og:title" content="{{ post.title }}">
<meta property="og:description" content="{{ post.description }}">
<meta property="og:url" content="{{ site_url }}/blog/{{ post.slug }}">
<meta property="og:image" content="{{ site_url }}/og-image.png">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{{ post.title }}">
<meta name="twitter:description" content="{{ post.description }}">
<meta name="twitter:image" content="{{ site_url }}/og-image.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,500;0,8..60,600;1,8..60,400&family=Instrument+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#0A1424; --navy-2:#0F1B30; --ivory:#EEF1F6; --soft:#A7B2C4; --mist:#67748A;
  --hairline:rgba(167,178,196,.13); --hairline-2:rgba(167,178,196,.24);
  --gold:#C9A551; --green:#3FBE8E;
  --serif:'Source Serif 4',Georgia,serif;
  --sans:'Instrument Sans',system-ui,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,monospace;
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--navy);color:var(--ivory);font-family:var(--sans);font-size:16px;
     line-height:1.6;-webkit-font-smoothing:antialiased;overflow-x:hidden}
a{color:var(--gold);text-decoration:none}
::selection{background:var(--gold);color:var(--navy)}
.ambient{position:fixed;inset:0;z-index:-2;pointer-events:none;
  background:radial-gradient(900px 500px at 15% -5%,rgba(201,165,81,.055),transparent 60%),
    radial-gradient(1100px 600px at 90% 15%,rgba(63,190,142,.04),transparent 60%)}

nav{position:sticky;top:0;z-index:50;display:flex;align-items:center;justify-content:space-between;
    padding:16px 32px;background:rgba(10,20,36,.82);backdrop-filter:blur(18px);border-bottom:1px solid var(--hairline)}
.logo{display:flex;align-items:center;gap:10px}
.logo-word{font-family:var(--serif);font-weight:600;font-size:19px;letter-spacing:-.01em;color:var(--ivory)}
.logo-word i{font-style:normal;color:var(--gold)}
.btn{display:inline-block;font-family:var(--sans);font-weight:500;font-size:14px;
  padding:10px 20px;border-radius:4px;border:1px solid var(--hairline-2);color:var(--ivory);transition:all .2s ease}
.btn:hover{border-color:var(--gold);color:var(--gold)}

main{max-width:700px;margin:0 auto;padding:56px 32px 40px}
.crumb{font-family:var(--mono);font-size:12px;color:var(--mist);letter-spacing:.05em;margin-bottom:24px;display:block}
.kicker{font-family:var(--mono);font-size:11.5px;letter-spacing:.15em;text-transform:uppercase;color:var(--mist);margin-bottom:16px}
h1{font-family:var(--serif);font-size:clamp(28px,4vw,40px);font-weight:500;letter-spacing:-.015em;line-height:1.2;margin-bottom:36px;color:var(--ivory)}

article{color:var(--soft);font-size:16.5px;line-height:1.85}
article h2{font-family:var(--serif);color:var(--ivory);font-size:23px;font-weight:600;margin:38px 0 14px}
article p{margin-bottom:16px}
article code{font-family:var(--mono);font-size:.88em;background:rgba(167,178,196,.1);padding:1px 6px;border-radius:3px;color:var(--ivory)}
article em{color:var(--mist)}

.cta-band{margin-top:52px;padding:30px 28px;border:1px solid var(--hairline-2);border-radius:8px;
  background:linear-gradient(160deg,var(--navy-2),rgba(15,27,48,.4));text-align:center}
.cta-band p{color:var(--soft);margin-bottom:16px;font-size:14.5px}

footer{border-top:1px solid var(--hairline);padding:32px;color:var(--mist);font-size:12.5px;line-height:1.75;max-width:700px;margin:40px auto 0}

@media(max-width:700px){nav,main,footer{padding-left:18px;padding-right:18px}}
</style>
</head>
<body>
<div class="ambient" aria-hidden="true"></div>

<nav>
  <a class="logo" href="/" aria-label="FundScan home">
    <svg width="24" height="24" viewBox="0 0 34 34" aria-hidden="true">
      <circle cx="17" cy="17" r="15.5" fill="none" stroke="#C9A551" stroke-width="1.6"/>
      <path d="M10 21 L15 16 L19 19 L24 12" fill="none" stroke="#3FBE8E" stroke-width="2.2" stroke-linecap="round"/>
      <circle cx="24" cy="12" r="2" fill="#3FBE8E"/>
    </svg>
    <span class="logo-word">FundScan<i>.</i></span>
  </a>
  <a href="/rates" class="btn">Live rates →</a>
</nav>

<main>
  <a class="crumb" href="/blog">← All guides</a>
  <div class="kicker">{{ post.published_at }}</div>
  <h1>{{ post.title }}</h1>
  <article>
    {{ post.body_html | safe }}
  </article>

  <div class="cta-band">
    <p>See the live, net-of-fees numbers this guide describes.</p>
    <a href="/rates" class="btn">View live rates →</a>
  </div>
</main>

<footer>
  <a href="/">Home</a> · <a href="/blog">All guides</a> · <a href="/accuracy">Accuracy</a> · <a href="/changelog">Changelog</a>
</footer>
</body>
</html>
